<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Brothers Group Site</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; }
    h1 { background: #333; color: #fff; padding: 20px; margin: 0; font-size: 2em; }
    .section { margin: 20px auto; padding: 20px; width: 60%; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
    input { padding: 10px; margin: 10px; width: 200px; }
    button { padding: 10px 20px; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>WELCOME TO MARIO BROTHERS</h1>
<div class="section" id="pin-section">
  <h2>Enter PIN</h2>
  <input type="password" id="pin-input" placeholder="Enter PIN">
  <button onclick="checkPin()">Submit</button>
  <p id="pin-message"></p>
</div>
<div class="section hidden" id="notice-board">
  <h2>Notice Board</h2>
  <p>Welcome! You are logged in ✅</p>
  <button onclick="openAdminPanel()">Open Admin Panel</button>
  <button onclick="logout()">Logout</button>
</div>
<div class="section hidden" id="admin-panel">
  <h2>Admin Control Panel</h2>
  <div id="admin-pass-section">
    <p>Enter Admin Password:</p>
    <input type="password" id="admin-pass" placeholder="Admin Password">
    <button onclick="checkAdminPassword()">Submit</button>
    <p id="admin-pass-message"></p>
  </div>

  <div class="hidden" id="admin-tools">
    <p>Lookup Member Info:</p>
    <input type="text" id="member-pin" placeholder="Enter Member PIN">
    <button onclick="showMemberInfo()">Lookup</button>
    <button onclick="throwOutMember()">Throw Out</button>
    <br><br>
    <p>Reset Member PIN:</p>
    <input type="text" id="reset-pin" placeholder="Enter PIN to Reset">
    <button onclick="resetMember()">Reset</button>
    <br><br>
    <button onclick="clearAllData()">Clear All Data</button>
    <div id="member-details"></div>
  </div>
</div>
<script>
  // Data setup
  let validPins = ["TECHNOLOGIA","AURA COMES BACK","SPIDERMAN"];
  const adminPin = "SUPERADMIN1234";
  const adminPassword = "SECRET123";

  let memberDetails = {
    "TECHNOLOGIA": { name: "Rahul Sharma", birthday: "12 March 2012", class: "6A", rollNo: "21", bloodGroup: "B+" },
    "AURA COMES BACK": { name: "Priya Das", birthday: "5 July 2012", class: "6A", rollNo: "14", bloodGroup: "O+" },
    "SPIDERMAN": { name: "Arjun Singh", birthday: "20 January 2012", class: "6A", rollNo: "7", bloodGroup: "A+" }
  };

  // Functions
  function checkPin() {
    const pin = document.getElementById("pin-input").value.trim().toUpperCase();
    const msg = document.getElementById("pin-message");

    if (pin === adminPin || validPins.includes(pin)) {
      msg.textContent = "Access granted!";
      document.getElementById("pin-section").classList.add("hidden");
      document.getElementById("notice-board").classList.remove("hidden");
    } else {
      msg.textContent = "Incorrect PIN!";
    }
  }

  function logout() {
    document.getElementById("notice-board").classList.add("hidden");
    document.getElementById("pin-section").classList.remove("hidden");
    document.getElementById("pin-message").textContent = "";
    document.getElementById("pin-input").value = "";
  }

  function openAdminPanel() {
    document.getElementById("admin-panel").classList.remove("hidden");
    window.scrollTo(0, document.body.scrollHeight);
  }

  function checkAdminPassword() {
    const pass = document.getElementById("admin-pass").value;
    if (pass === adminPassword) {
      document.getElementById("admin-pass-section").classList.add("hidden");
      document.getElementById("admin-tools").classList.remove("hidden");
    } else {
      document.getElementById("admin-pass-message").textContent = "Incorrect password!";
    }
  }

  function showMemberInfo() {
    const pin = document.getElementById("member-pin").value.trim().toUpperCase();
    const detailsDiv = document.getElementById("member-details");

    if (memberDetails[pin]) {
      const info = memberDetails[pin];
      detailsDiv.innerHTML = `
        <h3>Member Details</h3>
        <p><strong>Name:</strong> ${info.name}</p>
        <p><strong>Birthday:</strong> ${info.birthday}</p>
        <p><strong>Class:</strong> ${info.class}</p>
        <p><strong>Roll No.:</strong> ${info.rollNo}</p>
        <p><strong>Blood Group:</strong> ${info.bloodGroup}</p>
      `;
    } else {
      detailsDiv.innerHTML = "<p>No member found with that PIN.</p>";
    }
  }

  function throwOutMember() {
    const pin = document.getElementById("member-pin").value.trim().toUpperCase();
    if (validPins.includes(pin)) {
      validPins = validPins.filter(p => p !== pin);
      delete memberDetails[pin];
      alert(`Member with PIN "${pin}" has been removed.`);
    } else {
      alert("No member found with that PIN.");
    }
  }

  function resetMember() {
    const pin = document.getElementById("reset-pin").value.trim().toUpperCase();
    if (!pin) {
      alert("Please enter a PIN to reset.");
      return;
    }
    if (!validPins.includes(pin)) {
      validPins.push(pin);
    }
    if (!memberDetails[pin]) {
      memberDetails[pin] = {
        name: "Restored Member",
        birthday: "Unknown",
        class: "Unknown",
        rollNo: "Unknown",
        bloodGroup: "Unknown"
      };
    }
    alert(`PIN "${pin}" has been reset and is valid again.`);
  }

  function clearAllData() {
    if (confirm("Are you sure you want to reset everything?")) {
      validPins = ["TECHNOLOGIA","AURA COMES BACK","SPIDERMAN"];
      memberDetails = {
        "TECHNOLOGIA": { name: "Rahul Sharma", birthday: "12 March 2012", class: "6A", rollNo: "21", bloodGroup: "B+" },
        "AURA COMES BACK": { name: "Priya Das", birthday: "5 July 2012", class: "6A", rollNo: "14", bloodGroup: "O+" },
        "SPIDERMAN": { name: "Arjun Singh", birthday: "20 January 2012", class: "6A", rollNo: "7", bloodGroup: "A+" }
      };
      alert("All data has been reset to defaults.");
    }
  }
</script>
