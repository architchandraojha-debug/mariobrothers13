<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Brothers Group Site</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; }
    h1 { background: #333; color: #fff; padding: 20px; margin: 0; font-size: 2em; }
    .section { margin: 20px auto; padding: 20px; width: 60%; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
    input { padding: 10px; margin: 10px; width: 200px; }
    button { padding: 10px 20px; cursor: pointer; }
    iframe { width: 100%; height: 500px; border: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>WELCOME TO MARIO BROTHERS</h1>

  <!-- Join Form -->
  <div class="section" id="join-form">
    <h2>Join Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeF_OzGYIG5oRTMMdLHkA1r_ErD-n-nf-FbdH9hnQc92mgqbA/viewform?usp=publish-editor"></iframe>
  </div>

  <!-- PIN Section -->
  <div class="section" id="pin-section">
    <h2>Enter PIN</h2>
    <input type="password" id="pin-input" placeholder="Enter PIN">
    <button onclick="checkPin()">Submit</button>
    <p id="pin-message"></p>
  </div>

  <!-- Notice Board -->
  <div class="section hidden" id="notice-board">
    <h2>Notice Board</h2>
    <p>Welcome! You are logged in ✅</p>
    <br>
    <button onclick="openMemberInfo()">Go to Member Info Page</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Contact Admin -->
  <div class="section hidden" id="contact-admin">
    <h2>Contact Admin</h2>
    <p>If you have any queries, you can reach me here:</p>
    <a href="mailto:youraddress@example.com"><button>Email Admin</button></a>
    <a href="tel:+911234567890"><button>Call Admin</button></a>
  </div>

  <!-- Member Info -->
  <div class="section hidden" id="member-info-page">
    <h2>Member Info Lookup</h2>
    <div id="info-password-section">
      <p>Enter Admin Password:</p>
      <input type="password" id="info-admin-pass" placeholder="Admin Password">
      <button onclick="checkInfoPassword()">Submit</button>
      <p id="info-pass-message"></p>
    </div>
    <div class="hidden" id="lookup-section">
      <p>Enter Member PIN:</p>
      <input type="text" id="member-pin" placeholder="Enter Member PIN">
      <button onclick="showMemberInfo()">Lookup</button>
      <button onclick="throwOutMember(document.getElementById('member-pin').value)">Throw Out Member</button>
      <br><br>
      <p>Reset Member PIN:</p>
      <input type="text" id="reset-pin" placeholder="Enter PIN to Reset">
      <button onclick="resetMember()">Reset PIN</button>
      <div id="member-details"></div>
    </div>
  </div>

<script>
  // --- Load from Local Storage or defaults ---
  let memberPins = JSON.parse(localStorage.getItem("memberPins")) || ["TECHNOLOGIA","AURA COMES BACK","spiderman"];
  let memberDetails = JSON.parse(localStorage.getItem("memberDetails")) || {
    "TECHNOLOGIA": { name: "Rahul Sharma", birthday: "12 March 2012", class: "6A", rollNo: "21", bloodGroup: "B+" },
    "AURA COMES BACK": { name: "Priya Das", birthday: "5 July 2012", class: "6A", rollNo: "14", bloodGroup: "O+" },
    "spiderman": { name: "Arjun Singh", birthday: "20 January 2012", class: "6A", rollNo: "7", bloodGroup: "A+" }
  };

  const adminPin = "SUPERADMIN1234";
  const infoAdminPassword = "SECRET123";

  window.onload = function() {
    if (localStorage.getItem("hasJoined") === "true") {
      document.getElementById("join-form").classList.add("hidden");
    }
  };

  function checkPin() {
    const pin = document.getElementById("pin-input").value.trim();
    const msg = document.getElementById("pin-message");

    const normalizedPin = pin.toUpperCase();
    const normalizedMembers = memberPins.map(p => p.toUpperCase());

    if (normalizedPin === adminPin.toUpperCase() || normalizedMembers.includes(normalizedPin)) {
      msg.textContent = "Access granted!";
      localStorage.setItem("hasJoined", "true");
      document.getElementById("join-form").classList.add("hidden");
      document.getElementById("pin-section").classList.add("hidden");
      document.getElementById("notice-board").classList.remove("hidden");
      document.getElementById("contact-admin").classList.remove("hidden");
    } else {
      msg.textContent = "Incorrect PIN!";
    }
  }

  function logout() {
    localStorage.removeItem("hasJoined");
    alert("You have been logged out. Refresh to see Join Form again.");
    location.reload();
  }

  function openMemberInfo() {
    document.getElementById("member-info-page").classList.remove("hidden");
    window.scrollTo(0, document.body.scrollHeight);
  }

  function checkInfoPassword() {
    const pass = document.getElementById("info-admin-pass").value;
    if (pass === infoAdminPassword) {
      document.getElementById("info-password-section").classList.add("hidden");
      document.getElementById("lookup-section").classList.remove("hidden");
    } else {
      document.getElementById("info-pass-message").textContent = "Incorrect password!";
    }
  }

  function showMemberInfo() {
    const pin = document.getElementById("member-pin").value.trim();
    const detailsDiv = document.getElementById("member-details");

    if (memberDetails[pin]) {
      const info = memberDetails[pin];
      detailsDiv.innerHTML = `
        <h3>Member Details</h3>
        <p><strong>Name:</strong> ${info.name}</p>
        <p><strong>Birthday:</strong> ${info.birthday}</p>
        <p><strong>Class:</strong> ${info.class}</p>
        <p><strong>Roll No.:</strong> ${info.rollNo}</p>
        <p><strong>Blood Group:</strong> ${info.bloodGroup}</p>
      `;
    } else {
      detailsDiv.innerHTML = "<p>No member found with that PIN.</p>";
    }
  }

  function throwOutMember(pinToRemove) {
    const normalizedPin = pinToRemove.trim().toUpperCase();
    const index = memberPins.findIndex(p => p.toUpperCase() === normalizedPin);
    if (index !== -1) {
      memberPins.splice(index, 1);
      delete memberDetails[pinToRemove];
      localStorage.setItem("memberPins", JSON.stringify(memberPins));
      localStorage.setItem("memberDetails", JSON.stringify(memberDetails));
      alert(`Member with PIN "${pinToRemove}" has been permanently removed.`);
    } else {
      alert("No member found with that PIN.");
    }
  }

  function resetMember() {
    const pinToReset = document.getElementById("reset-pin").value.trim();
    if (!pinToReset) {
      alert("Please enter a PIN to reset.");
      return;
    }

    if (!memberPins.includes(pinToReset)) {
      memberPins.push(pinToReset);
    }

    if (!memberDetails[pinToReset]) {
      memberDetails[pinToReset] = {
        name: "Restored Member",
        birthday: "Unknown",
        class: "Unknown",
        rollNo: "Unknown",
        bloodGroup: "Unknown"
      };
    }

    localStorage.setItem("memberPins", JSON.stringify(memberPins));
    localStorage.setItem("memberDetails", JSON.stringify(memberDetails));

    alert(`PIN "${pinToReset}" has been reset and is valid again.`);
  }
</script>
</body>
</html>
